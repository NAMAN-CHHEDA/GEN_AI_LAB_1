# Tiny smoke config — 1 short epoch to verify the pipeline.
base: config.yaml
run_name: smoke

data:
  train_sequences: 256
  val_sequences: 64
  block_size: 64
  train_stride: 64
  val_stride: 64

model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 128
  dropout: 0.0
  attn_dropout: 0.0

train:
  epochs: 1
  batch_size: 16
  lr: 3.0e-3
  min_lr: 3.0e-4
  warmup_steps: 5
  amp: false
  log_every: 5

eval:
  batch_size: 32
  train_eval_batches: 4

generation:
  max_new_tokens: 80
